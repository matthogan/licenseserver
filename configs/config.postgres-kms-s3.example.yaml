# Production component-adapter profile. Credentials remain in the AWS default
# credential chain and LICD_DATABASE_URL; this file contains no secrets.
server:
  public_listen: "127.0.0.1:9443"
  admin_transport: tcp
  admin_listen: "127.0.0.1:9444"
  allow_insecure_admin: true

tls:
  enabled: false
  min_version: "1.3"
  reverse_proxy: { enabled: false, trusted_cidrs: [] }

database:
  driver: postgres
  dsn: ""
  dsn_env: LICD_DATABASE_URL # Must include sslmode=verify-full.
  migration_backup_max_age: 24h
  postgres:
    max_connections: 20
    min_connections: 2
    max_conn_lifetime: 1h

signer:
  provider: aws-kms
  root_public_key_file: "./secrets/root.pub"
  issuer_certificate_file: "./secrets/kms-issuer.cert"
  kms:
    key_id: "arn:aws:kms:eu-west-1:123456789012:key/replace-me"
    region: eu-west-1
    endpoint: ""

archive:
  provider: s3
  paid_licence_ack_policy: strict
  s3:
    bucket: replace-me-immutable-licence-archive
    prefix: licence-events
    region: eu-west-1
    endpoint: ""
    force_path_style: false
    encryption: sse-kms
    kms_key_id: "arn:aws:kms:eu-west-1:123456789012:key/replace-me"
    object_lock_mode: COMPLIANCE
    object_lock_for: 8760h

backup:
  continuous:
    enabled: false # Use managed PostgreSQL backup/PITR.
    required: false

trial:
  default_duration: 720h
  pepper_env: LICD_TRIAL_PEPPER
activation:
  pepper_env: LICD_ACTIVATION_PEPPER
rate_limit:
  pepper_env: LICD_RATE_LIMIT_PEPPER
  window: 1m
  retention: 24h
  trial: { per_ip: 10, per_subject: 3, per_product: 100 }
  activation: { per_ip: 20, per_code: 20 }
  status: { per_ip: 60 }

http:
  max_body_bytes: 65536
  max_header_bytes: 16384
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s

logging:
  format: json
  level: info
  output: stdout
  file: { max_size_bytes: 10485760, max_backups: 10, max_age: 720h }
