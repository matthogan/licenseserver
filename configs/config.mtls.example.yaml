# Server-side example for direct public TLS 1.3 and remote admin mTLS.
server:
  public_listen: ":9443"
  admin_transport: tcp
  admin_listen: "10.10.0.5:9444"
  allow_insecure_admin: false

tls:
  enabled: true
  min_version: "1.3"
  certificate_file: "/etc/licd/tls/public.crt"
  private_key_file: "/run/secrets/licd_public_tls.key"
  reverse_proxy:
    enabled: false

admin_tls:
  enabled: true
  certificate_file: "/etc/licd/tls/admin.crt"
  private_key_file: "/run/secrets/licd_admin_tls.key"
  client_ca_file: "/etc/licd/tls/admin-client-ca.crt"

admin_authorization:
  # Keys may be a certificate CN, URI SAN, DNS SAN, full subject, or sha256 fingerprint.
  identities:
    - match: "spiffe://example.com/licensing/operators"
      roles: [viewer, operator]
    - match: "spiffe://example.com/licensing/revokers"
      roles: [viewer, revoker]
    - match: "licensing-admin"
      roles: [admin]

# Remaining database, signer, archive, trial, HTTP and logging settings are
# identical to config.linux.yaml and must also be supplied in the real file.
