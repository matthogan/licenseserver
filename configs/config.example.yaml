server:
  # Development profile: public and admin traffic never leave loopback.
  public_listen: "127.0.0.1:9443"
  admin_transport: tcp
  admin_listen: "127.0.0.1:9444"
  allow_insecure_admin: true
  read_only: false

tls:
  enabled: false # Direct non-loopback deployments must enable TLS 1.3.
  min_version: "1.3"
  certificate_file: ""
  private_key_file: ""
  reverse_proxy:
    enabled: false
    trusted_cidrs: []

admin_tls:
  enabled: false
  certificate_file: ""
  private_key_file: ""
  client_ca_file: ""

admin_authorization:
  identities: []

database:
  driver: sqlite
  dsn: "./data/licensing.db"
  dsn_env: LICD_DATABASE_URL # Required instead of dsn when driver is postgres.
  migration_backup_max_age: 24h
  sqlite:
    journal_mode: WAL
    synchronous: FULL
    foreign_keys: true
    busy_timeout: 5s
  postgres:
    max_connections: 20
    min_connections: 2
    max_conn_lifetime: 1h

signer:
  provider: file
  root_public_key_file: "./secrets/root.pub"
  key_directory: "./secrets"
  private_key_file: "./secrets/issuer.key"
  issuer_certificate_file: "./secrets/issuer.cert"
  kms:
    key_id: ""
    region: ""
    endpoint: ""

archive:
  provider: filesystem
  directory: "./data/archive"
  paid_licence_ack_policy: strict
  s3:
    bucket: ""
    prefix: licence-events
    region: ""
    endpoint: ""
    force_path_style: false
    encryption: sse-kms
    kms_key_id: ""
    object_lock_mode: COMPLIANCE
    object_lock_for: 8760h

backup:
  continuous:
    enabled: false
    required: true
    binary: litestream # Litestream v0.5.12 or newer.
    config_file: "./data/licensing.db.litestream.yml"
    replica_url: "s3://replace-me/licd/production/licensing.db"
    sync_interval: 1s
    snapshot_interval: 24h
    retention: 720h
    validation_interval: 5m
    health_check_interval: 1m
    max_backup_age: 5m
    shutdown_timeout: 30s
    s3:
      region: eu-west-1
      endpoint: "" # Must be HTTPS for an S3-compatible service.
      force_path_style: false
      encryption:
        mode: sse-kms
        kms_key_id: "alias/licd-backup" # Or set kms_key_id_env instead.
        kms_key_id_env: ""
        customer_key_env: "" # Required only when mode is sse-c.

recovery_drill:
  enabled: false # Safe simulation needs no S3 credentials; enable scheduling deliberately.
  required: false # When true, an overdue successful report blocks readiness.
  mode: simulation # Change to credentialed only after S3/KMS/archive access is provisioned.
  schedule_interval: 168h
  max_report_age: 192h
  timeout: 2h
  rpo_objective: 5m
  rto_objective: 1h
  report_directory: "./data/recovery-drills" # Use an absolute path outside development.
  report_retention: 4320h
  reverse_proxy_url: "" # Absolute production HTTPS origin, without a path.
  require_reverse_proxy: false
  max_memory_bytes: 536870912
  max_goroutines: 1000
  max_temporary_storage_bytes: 21474836480

trial:
  default_duration: 720h
  pepper_env: LICD_TRIAL_PEPPER

activation:
  pepper_env: LICD_ACTIVATION_PEPPER

rate_limit:
  pepper_env: LICD_RATE_LIMIT_PEPPER
  window: 1m
  retention: 24h
  trial:
    per_ip: 10
    per_subject: 3
    per_product: 100
  activation:
    per_ip: 20
    per_code: 20
  status:
    per_ip: 60

http:
  max_body_bytes: 65536
  max_header_bytes: 16384
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s

logging:
  format: json
  level: info
  output: stdout # Or an absolute file path for built-in rotation.
  file:
    max_size_bytes: 10485760
    max_backups: 10
    max_age: 720h

admin:
  transport: tcp
  url: "http://127.0.0.1:9444"
