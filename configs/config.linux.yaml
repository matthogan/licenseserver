server:
  public_listen: "127.0.0.1:9443" # Publish through a TLS 1.3 reverse proxy.
  admin_transport: unix
  admin_socket: "/run/licd/admin.sock"
  admin_socket_mode: "0660"
  read_only: false

tls:
  enabled: false
  min_version: "1.3"
  certificate_file: ""
  private_key_file: ""
  reverse_proxy:
    enabled: true
    trusted_cidrs: ["127.0.0.1/32", "::1/128"]

admin_tls:
  enabled: false

admin_authorization:
  identities: []

database:
  driver: sqlite
  dsn: "/var/lib/licd/licensing.db"
  migration_backup_max_age: 24h
  sqlite:
    journal_mode: WAL
    synchronous: FULL
    foreign_keys: true
    busy_timeout: 5s

signer:
  provider: file
  root_public_key_file: "/etc/licd/root.pub"
  key_directory: "/etc/licd/secrets"
  private_key_file: "/etc/licd/secrets/issuer.key"
  issuer_certificate_file: "/etc/licd/secrets/issuer.cert"

archive:
  provider: filesystem
  # Mount off-host/versioned storage here for independent DR protection.
  directory: "/var/lib/licd/archive"
  paid_licence_ack_policy: strict

backup:
  continuous:
    enabled: false # Enable after provisioning the bucket, IAM policy, and KMS key.
    required: true
    binary: /usr/bin/litestream
    config_file: /var/lib/licd/litestream.generated.yml
    replica_url: "s3://replace-me/licd/production/licensing.db"
    sync_interval: 1s
    snapshot_interval: 24h
    retention: 720h
    validation_interval: 5m
    health_check_interval: 1m
    max_backup_age: 5m
    shutdown_timeout: 30s
    s3:
      region: eu-west-1
      endpoint: ""
      force_path_style: false
      encryption:
        mode: sse-kms
        kms_key_id: "alias/licd-backup"
        kms_key_id_env: ""
        customer_key_env: ""

recovery_drill:
  enabled: false
  required: false
  mode: simulation
  schedule_interval: 168h
  max_report_age: 192h
  timeout: 2h
  rpo_objective: 5m
  rto_objective: 1h
  report_directory: "/var/lib/licd/recovery-drills"
  report_retention: 4320h
  reverse_proxy_url: ""
  require_reverse_proxy: false
  max_memory_bytes: 536870912
  max_goroutines: 1000
  max_temporary_storage_bytes: 21474836480

trial:
  default_duration: 720h
  pepper_env: LICD_TRIAL_PEPPER

activation:
  pepper_env: LICD_ACTIVATION_PEPPER

rate_limit:
  pepper_env: LICD_RATE_LIMIT_PEPPER
  window: 1m
  retention: 24h
  trial:
    per_ip: 10
    per_subject: 3
    per_product: 100
  activation:
    per_ip: 20
    per_code: 20
  status:
    per_ip: 60

http:
  max_body_bytes: 65536
  max_header_bytes: 16384
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s

logging:
  format: json
  level: info
  output: stdout # journald supplies rotation/retention
  file:
    max_size_bytes: 10485760
    max_backups: 10
    max_age: 720h

admin:
  transport: unix
  socket: "/run/licd/admin.sock"
