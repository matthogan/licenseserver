when:
  - event: [push, pull_request, manual, tag]

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0

services:
  - name: postgres
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: licenceserver_test
      POSTGRES_USER: licd_test
      POSTGRES_PASSWORD: disposable-test-password

steps:
  - name: test
    # Build once on the Docker daemon used by the local Woodpecker agent:
    # docker compose -f compose.test.yaml build
    image: local/licd-test:go1.26.6-litestream0.5.12-v1
    pull: false
    commands:
      - bash scripts/ci/run-tests.sh

  - name: release-candidate
    image: local/licd-release:tools-v1
    pull: false
    when:
      - event: tag
        ref: refs/tags/v*
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - licd-release-candidates:/releases
    commands:
      - bash scripts/release/build.sh
